<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بۆ شووشە 💖</title>

    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Tahoma, 'Segoe UI', sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }

        .box {
            background: white;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            width: 85%;
            max-width: 350px;
            position: relative;
        }

        .cat-img {
            width: 130px;
            height: 130px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        h1 { color: #ff4b72; font-size: 1.6rem; margin-bottom: 8px; }
        p { color: #444; font-size: 1.05rem; line-height: 1.5; margin-bottom: 20px; }

        .btns {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            position: relative;
            min-height: 60px;
        }

        button {
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        #yesBtn {
            background: #ff4b72;
            color: white;
            box-shadow: 0 4px 10px rgba(255, 75, 114, 0.3);
            z-index: 2;
        }

        #noBtn {
            background: #e0e0e0;
            color: #666;
            position: absolute;
            z-index: 10;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <!-- Preshandani pirsyarakah -->
    <div class="box" id="card1">
        <!-- Cat Image -->
        <img id="catImg" class="cat-img" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3Z2eHowdmk5Zmd1NWZodDdocXZ0NDd6OGY0Nzh6eGN2dDduZ3pxZCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/Lq0h93752f6J9tijrh/giphy.gif" alt="Cute Cat">
        
        <h1>هایی شووشە! 💖</h1>
        <p id="msgText">ئەبی بە باشترین هاوڕێم شیرەکەم؟؟</p>
        
        <div class="btns">
            <button id="yesBtn" onclick="yesClicked()">بەڵێ! 💖</button>
            <button id="noBtn" onclick="moveNo(event)" ontouchstart="moveNo(event)">نەخێر ❌</button>
        </div>
    </div>

    <!-- Preshandani encamakam -->
    <div class="box hidden" id="card2">
        <img class="cat-img" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNXJhZXVsZnF5cTFscXp4czhkZ3VndDF6ODJtdG14ZnIycHRzOXQyciZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/MDJ9IbxxvDUQM/giphy.gif" alt="Happy Cat">
        <h1>ماچێکم بەرێ مواح</h1>
        <p>دەزانم هەر بەڵێ دەکەیت! <br>ئیتر بۆ هەتا هەتایە لە کۆڵم نابیتەوە 💋</p>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const catImg = document.getElementById('catImg');
        const msgText = document.getElementById('msgText');

        // Sad cat crying memes
        const sadCats = [
            "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExbnFlcWg3OHF4eHRubWVrMXptM3lndTh1MGFidG1xeXQybzhxdnpzOSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/d22UJ47yv74q6424/giphy.gif",
            "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExaGcxYzdyZHQxeXZwZnRzcTByYnIwbmswOG5ybzVpYzlydHgyOXlqZCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/BEob506BCpE88/giphy.gif"
        ];

        let count = 0;

        // Function for running away on mobile tap / click
        function moveNo(e) {
            e.preventDefault(); // Ragenandani kliky asayi
            
            // Gorini weney pishilaka bo xambar
            catImg.src = sadCats[count % sadCats.length];
            msgText.innerHTML = "بۆ نەخێر ئەکەی کاکە چیم لێ کردووی؟";
            count++;

            // Rakirdani dukhmeh "Naxer"
            const x = Math.floor(Math.random() * 220) - 110;
            const y = Math.floor(Math.random() * 220) - 110;
            noBtn.style.transform = `translate(${x}px, ${y}px)`;
        }

        // Katici dukhmeh "Bale" dadagirit
        function yesClicked() {
            document.getElementById('card1').classList.add('hidden');
            document.getElementById('card2').classList.remove('hidden');

            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });
        }
    </script>
</body>
</html>
